<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- WEB-PRD Phase 13: the same policy is sent as a header by Cloudflare Pages (public/_headers); this copy covers local use.
         connect-src allows only this site, so nothing the app holds can be sent anywhere else. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Spadewick</title>
    <style>
      .web-problem { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #222; text-align: center }
      .web-problem h1 { font-size: 20px; margin: 0 }
      .web-problem p { max-width: 560px; margin: 0 }
      @media (prefers-color-scheme: dark) { .web-problem { background: #1e1e1e; color: #eee } }
      /* shown until the background part of the app is ready (WEB-PRD Phase 9); main.js removes it */
      .web-loading { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; font: 15px/1.5 system-ui, sans-serif; background: #fff; color: #222 }
      .web-loading .mark { font-size: 40px; animation: web-pulse 1.4s ease-in-out infinite }
      .web-loading small { color: #777 }
      @keyframes web-pulse { 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) { .web-loading .mark { animation: none } }
      @media (prefers-color-scheme: dark) { .web-loading { background: #1e1e1e; color: #eee } .web-loading small { color: #999 } }
    </style>
  </head>
  <body>
    <div id="web-loading" class="web-loading" role="status"><span class="mark" aria-hidden="true">♠</span><span>Starting Spadewick…</span>
      <small>The first visit downloads about 10 MB. Nothing is uploaded.</small></div>
    <div id="web-shell"></div>
    <div id="app"></div>
    <noscript>Spadewick runs in your browser and needs JavaScript.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
